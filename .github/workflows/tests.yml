name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist

      # config.toml holds personal figures and is gitignored, but a few tests
      # (settings GUI round-trip, config parsing) read it. The committed
      # template has the same keys, so it stands in for CI.
      - name: Provide config from template
        run: cp config.example.toml config.toml

      - name: Run tests
        run: pytest -q -n auto --durations=10
